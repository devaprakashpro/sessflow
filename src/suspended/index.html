<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suspended — Sessflow</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #e6e9ef;
        font-family: Inter, system-ui, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        cursor: pointer;
        text-align: center;
        padding: 24px;
      }
      img.fav {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        opacity: 0.9;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
        max-width: 640px;
      }
      .url {
        color: #8b93a7;
        font-size: 13px;
        word-break: break-all;
        max-width: 640px;
      }
      .hint {
        margin-top: 6px;
        font-size: 12px;
        color: #6b7280;
      }
      .badge {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6366f1;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap" title="Click anywhere to reload this tab">
      <div class="badge">Sessflow · Suspended</div>
      <img class="fav" id="fav" alt="" />
      <h1 id="title">Tab suspended to save memory</h1>
      <div class="url" id="url"></div>
      <div class="hint">Click anywhere (or refocus the tab) to restore it.</div>
    </div>
    <script type="module" src="./suspended.ts"></script>
  </body>
</html>
